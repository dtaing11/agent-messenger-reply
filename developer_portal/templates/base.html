<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "[45]..", "swap": true, "error": true}]}'>
  <title>{% block title %}Town Donut portal{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/vendor/pico-2.0.6.min.css">
  <link rel="stylesheet" href="/admin/static/app.css">
  <script src="/admin/static/vendor/htmx-2.0.4.min.js" defer></script>
  <script src="/admin/static/app.js" defer></script>
</head>
<body{% if user %} hx-headers='{"X-CSRF-Token": "{{ user.csrf_token }}"}'{% endif %}>
  <header class="container">
    <nav>
      <ul><li><strong>Town Donut</strong> <small class="muted">developer portal</small></li></ul>
      {% if user %}
      <ul>
        <li><a href="/admin/" {% if nav == 'overview' %}aria-current="page"{% endif %}>Overview</a></li>
        <li><a href="/admin/integrations" {% if nav == 'integrations' %}aria-current="page"{% endif %}>Integrations</a></li>
        <li><a href="/admin/business" {% if nav == 'business' %}aria-current="page"{% endif %}>Business</a></li>
        <li><a href="/admin/orders" {% if nav == 'orders' %}aria-current="page"{% endif %}>Orders</a></li>
        <li><a href="/admin/audit" {% if nav == 'audit' %}aria-current="page"{% endif %}>Audit</a></li>
        <li>
          <form method="post" action="/admin/logout" class="inline">
            <input type="hidden" name="csrf_token" value="{{ user.csrf_token }}">
            <button type="submit" class="secondary outline small">Log out</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
