name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # The search model (~70 MB) is kept between runs, so it downloads only when it changes.
      - uses: actions/cache@v4
        with:
          path: data/models
          key: search-model-bge-small-en-v1.5-${{ hashFiles('requirements.txt') }}
      - run: python -m app.download_model
      # SPRINKLE_REAL_MODEL also runs the search tests that use the real model.
      - run: pytest -q
        env:
          SPRINKLE_REAL_MODEL: "1"
